services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: wiora
      POSTGRES_PASSWORD: wiora
      POSTGRES_DB: wiora
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiora -d wiora"]
      interval: 2s
      timeout: 5s
      retries: 20

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9002:9000"
      - "9003:9001"
    environment:
      MINIO_ROOT_USER: wiora
      MINIO_ROOT_PASSWORD: wiora-local-secret
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000
    user: "0:0"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
